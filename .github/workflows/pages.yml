name: Publicar portafolio en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Validar contenido
        run: npm run check:data
      - name: Configurar Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Compilar con la ruta de Pages
        env:
          PORTFOLIO_BASE: ${{ steps.pages.outputs.base_path }}
        run: npm run build -- --base-href "${PORTFOLIO_BASE}/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/portafolio/browser
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
